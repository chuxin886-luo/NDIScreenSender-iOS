name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write        # 发 Release 需要（iPad 免登录下载用）

jobs:
  build:
    # XcodeGen 生成的是 Xcode 16 格式（objectVersion 77），
    # macos-14 只带 Xcode 15.4，读不了 → 必须用 macos-15
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 选择最新 Xcode 并输出环境
        run: |
          set -e
          ls -d /Applications/Xcode*.app || true
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "使用 $LATEST"
          sudo xcode-select -s "$LATEST"
          echo "---- 版本 ----"
          xcodebuild -version
          sw_vers

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 检测 NDI SDK（没有就切纯 UDP 模式）
        run: |
          if [ -f "NDI/include/Processing.NDI.Lib.h" ]; then
            echo "✓ 找到 NDI SDK，编译双模式"
          else
            echo "→ 没有 NDI SDK，自动剥离 NDI 依赖，只编 UDP 模式"
            python3 scripts/strip_ndi.py project.yml
          fi

      - name: 生成 Xcode 工程
        run: xcodegen generate

      # 双保险：万一 runner 上还是旧版 Xcode，把项目格式降到它能读的版本
      - name: 项目格式兼容性处理
        run: |
          set -e
          MAJOR=$(xcodebuild -version | head -n1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          echo "Xcode 主版本: $MAJOR"
          P="NDIScreenSender.xcodeproj/project.pbxproj"
          if [ "$MAJOR" -lt 16 ]; then
            echo "→ Xcode < 16，把 objectVersion 降到 56"
            sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/' "$P"
          else
            echo "→ Xcode >= 16，保持原格式"
          fi
          grep -m1 objectVersion "$P" || true

      - name: 编译（不签名，不需要开发者账号）
        run: |
          set -euo pipefail
          xcodebuild \
            -project NDIScreenSender.xcodeproj \
            -scheme NDIScreenSender \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/NDIScreenSender.app"
          test -d "$APP" || { echo "找不到 $APP"; exit 1; }
          ls -la "$APP"
          echo "--- PlugIns（广播扩展）---"
          ls -la "$APP/PlugIns" || true

          mkdir -p Payload
          cp -R "$APP" Payload/
          rm -rf Payload/NDIScreenSender.app/_CodeSignature
          rm -f  Payload/NDIScreenSender.app/embedded.mobileprovision
          zip -qry NDIScreenSender-unsigned.ipa Payload
          ls -lh NDIScreenSender-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: NDIScreenSender-unsigned-ipa
          path: NDIScreenSender-unsigned.ipa
          retention-days: 30

      # 发一个 Release：Public 仓库的 Release 资产是公开直链，
      # 而 Artifact 必须登录 GitHub 才能下。这样 iPad 上可以直接点下载。
      - name: 发布 Release（供 iPad 直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 构建 #${{ github.run_number }}
          body: |
            未签名 IPA，用 NB 助手 / Sideloadly / TrollStore 签名安装。

            - commit: ${{ github.sha }}
          files: NDIScreenSender-unsigned.ipa
          fail_on_unmatched_files: true
